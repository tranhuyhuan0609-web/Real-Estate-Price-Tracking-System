[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "real-estate-tracker"
version = "2.0.0"
description = "Event-driven real estate price tracking system with Medallion architecture"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { file = "LICENSE" }
dependencies = [
    "aiokafka>=0.11",
    "httpx>=0.27",
    "parsel>=1.9",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymongo>=4.9",          # AsyncMongoClient
    "pyyaml>=6.0",           # configs/sites/*.yaml
    "prometheus-client>=0.20",  # /metrics on METRICS_PORT
    # Migrations (`make migrate`). Alembic needs SQLAlchemy; the URL uses the psycopg v3 driver.
    "alembic>=1.13",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
# Headless browser used by the phone revealer. Run `playwright install chromium` afterwards.
browser = ["playwright>=1.49"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "testcontainers[postgres,mongodb]>=4.8",
]

[project.scripts]
realestate = "realestate.entrypoints.cli:main"
realestate-scheduler = "realestate.entrypoints.scheduler:main"
realestate-bronze-worker = "realestate.entrypoints.bronze_worker:main"
realestate-silver-gold-worker = "realestate.entrypoints.silver_gold_worker:main"
realestate-dlq-worker = "realestate.entrypoints.dlq_worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/realestate"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# "." makes `tests.helpers` / `tests.conftest` importable from nested test dirs.
pythonpath = ["src", "."]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: needs Docker (testcontainers); run with `make test-integration`",
]

[tool.coverage.run]
source = ["src/realestate"]
branch = true

[tool.coverage.report]
# Unit + contract suite (what `make cov` / CI measure). Raise it as coverage grows; never lower it.
fail_under = 77
show_missing = true
skip_covered = true

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "ASYNC"]
ignore = ["E501"]  # long lines are left to the formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC109"]  # test doubles mirror httpx signatures

[tool.ruff.lint.isort]
known-first-party = ["realestate", "tests"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["realestate"]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

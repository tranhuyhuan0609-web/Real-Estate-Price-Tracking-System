name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, typecheck, unit & contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (from uv.lock)
        run: uv sync --frozen
      - name: Lock files are in sync
        run: |
          uv lock --check
          uv export --frozen --no-dev --no-emit-project --no-header -o /tmp/requirements.lock
          diff -u requirements.lock /tmp/requirements.lock
      - name: Ruff
        run: |
          uv run --frozen ruff check src tests migrations scripts
          uv run --frozen ruff format --check src tests migrations scripts
      - name: Mypy
        run: uv run --frozen mypy
      - name: Pytest (coverage gate: tool.coverage.report.fail_under)
        run: uv run --frozen pytest --cov --cov-report=term --cov-report=xml

  integration:
    name: Integration tests (testcontainers)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen pytest -m integration tests/integration

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose --env-file .env -f docker/docker-compose.yml config -q
      - run: docker build -f docker/Dockerfile -t realestate-tracker:ci .
